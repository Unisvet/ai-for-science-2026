[project]
name = "ai-for-science-2026-demos"
version = "1.0.0"
description = "Companion Python demos for APAC AI for Science DevFest 2026: AlphaEvolve, Evo-FedAgg & Cloud TPU Evaluators"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "google-genai>=1.0.0",
    "alpha-evolve",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
live-gcp = [
    "google-genai>=1.0.0",
    "google-antigravity>=0.1.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-auth>=2.35.0",
]

[tool.uv.sources]
alpha-evolve = { git = "https://github.com/Google-Cloud-AI/alphaevolve-on-googlecloud.git" }
